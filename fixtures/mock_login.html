<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>书源登录表单</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 24px; background: #f6f7f9; color: #222; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 20px; max-width: 420px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    label { display: block; margin: 12px 0 4px; font-size: 14px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    button { margin-top: 16px; width: 100%; padding: 14px 16px; background: #111; color: #fff; border: none; border-radius: 8px; font-size: 17px; font-weight: 600; }
    .hint { color: #666; font-size: 13px; margin-top: 12px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="card">
    <h1>书源登录表单</h1>
    <p class="hint">受控 mock：香色 WebView 打开本页，禁止用系统 Alert 冒充。</p>
    <form method="GET" action="/mock_login_ok.html" id="lb-login-form">
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" placeholder="username" autocomplete="username" />
      <label for="password">密码</label>
      <input id="password" name="password" type="password" placeholder="password" autocomplete="current-password" />
      <button type="submit" id="lb-login-submit">登录</button>
    </form>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>网页验证</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 24px; background: #f6f7f9; color: #222; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 20px; max-width: 420px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { line-height: 1.5; }
    #status { color: #0a7; font-weight: 600; }
    #lb-await-done-btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 14px 16px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      font: bold 17px -apple-system, sans-serif;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>人机/等待验证页</h1>
    <p>本页模拟 Cloudflare 等待成功：写入 Cookie <code>AWAIT_TOKEN=ok</code>。</p>
    <p id="status">正在写入 Cookie…</p>
    <p>Cookie 写入后，点击下方「完成验证」继续搜索。</p>
    <button id="lb-await-done-btn" type="button" aria-label="完成验证">完成验证</button>
  </div>
  <script>
    try { document.cookie = "LB_AWAIT_DONE=; path=/; max-age=0"; } catch (e0) {}
    document.cookie = "AWAIT_TOKEN=ok; path=/; max-age=86400";
    document.cookie = "AWAIT_MARK=browser_await_" + Date.now() + "; path=/; max-age=86400";
    document.getElementById("status").textContent = "Cookie 已写入：AWAIT_TOKEN=ok";

    function lbMarkAwaitDone() {
      try { document.cookie = "LB_AWAIT_DONE=1; path=/; max-age=600"; } catch (e) {}
      window.__lbAwaitDone = 1;
      try {
        var st = document.getElementById("status");
        if (st) st.textContent = "已点完成验证，等待 App 继续…";
      } catch (e3) {}
    }
    document.getElementById("lb-await-done-btn").addEventListener("click", lbMarkAwaitDone);
  </script>
</body>
</html>

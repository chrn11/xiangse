name: Clean old Actions artifacts

on:
  schedule:
    # Run daily; keep the newest two artifacts for each artifact name.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: clean-old-artifacts
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts older than seven days
        uses: actions/github-script@v7
        env:
          ARTIFACT_MAX_AGE_DAYS: '7'
          ARTIFACTS_TO_KEEP: '2'
        with:
          script: |
            const maxAgeDays = Number(process.env.ARTIFACT_MAX_AGE_DAYS);
            const keepCount = Number(process.env.ARTIFACTS_TO_KEEP);
            const cutoff = Date.now() - maxAgeDays * 24 * 60 * 60 * 1000;

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );

            const byName = new Map();
            for (const artifact of artifacts) {
              if (!byName.has(artifact.name)) byName.set(artifact.name, []);
              byName.get(artifact.name).push(artifact);
            }

            const candidates = [];
            for (const [name, items] of byName) {
              items.sort((a, b) =>
                new Date(b.created_at).getTime() - new Date(a.created_at).getTime()
              );
              for (const artifact of items.slice(keepCount)) {
                if (new Date(artifact.created_at).getTime() < cutoff) {
                  candidates.push({ name, artifact });
                }
              }
            }

            let deleted = 0;
            for (const { name, artifact } of candidates) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              deleted += 1;
              core.info(`Deleted ${name} #${artifact.id} (${artifact.size_in_bytes} bytes)`);
            }

            const released = candidates.reduce(
              (sum, item) => sum + (item.artifact.size_in_bytes || 0), 0
            );
            await core.summary
              .addHeading('Artifact cleanup')
              .addList([
                `Policy: delete artifacts older than ${maxAgeDays} days`,
                `Keep: newest ${keepCount} for each artifact name`,
                `Deleted: ${deleted}`,
                `Approximate space released: ${(released / 1024 / 1024).toFixed(1)} MiB`,
              ])
              .write();

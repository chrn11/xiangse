name: LegadoBridge CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # TC-11 stage 1：固定夹具（不依赖网络 / 不依赖 Xcode）
  fixture-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: fixture-gate
        run: python3 tools/ci/validate_fixtures.py

  # TC-11 stage 2：Python 静态 / gate 单测（前一 stage 失败则本 job 不跑）
  python-gates:
    needs: [fixture-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Python static gates + unittest
        run: |
          set -euo pipefail
          python3 tools/ci/validate_test_file_manifest.py
          python3 tools/ci/validate_hooks_gate.py
          python3 tools/ci/validate_ci_test_targets.py
          python3 -m unittest discover -s tools/ci -p 'test_*.py'

  # TC-11 stage 3–6：xcodebuild -list + 三 scheme 全量单测（无 -only-testing）
  spm-full-tests:
    needs: [python-gates]
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: 解析 Simulator destination
        id: dest
        working-directory: LegadoBridge
        run: |
          set -euo pipefail
          swift package resolve
          DEST=""
          for name in "iPhone 15" "iPhone 16" "iPhone 15 Pro" "iPhone SE (3rd generation)"; do
            if xcrun simctl list devices available | grep -F "$name (" >/dev/null; then
              DEST="platform=iOS Simulator,name=${name}"
              break
            fi
          done
          if [[ -z "$DEST" ]]; then
            name=$(xcrun simctl list devices available | sed -n 's/^[[:space:]]*\(iPhone [^()]*\).*/\1/p' | head -1 | sed 's/[[:space:]]*$//')
            [[ -n "$name" ]] && DEST="platform=iOS Simulator,name=${name}"
          fi
          if [[ -z "$DEST" ]]; then
            echo "无可用 iPhone Simulator" >&2
            exit 1
          fi
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"

      - name: xcodebuild -list（验证 schemes/targets）
        working-directory: LegadoBridge
        run: |
          set -euo pipefail
          xcodebuild -list -packagePath . 2>&1 | tee ../spm-schemes.log

      - name: LegadoRuleCoreTests 全量
        working-directory: LegadoBridge
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme LegadoRuleCore \
            -destination "${{ steps.dest.outputs.dest }}" \
            -resultBundlePath "$PWD/LegadoRuleCore.xcresult" \
            -derivedDataPath "$PWD/.build-test-full" \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            2>&1 | tee ../LegadoRuleCore-full.log

      - name: LegadoBridgeTests 全量
        working-directory: LegadoBridge
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme LegadoBridge \
            -destination "${{ steps.dest.outputs.dest }}" \
            -resultBundlePath "$PWD/LegadoBridge.xcresult" \
            -derivedDataPath "$PWD/.build-test-full" \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            2>&1 | tee ../LegadoBridge-full.log

      - name: LegadoBridgeHooksTests 全量
        working-directory: LegadoBridge
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme LegadoBridgeHooks \
            -destination "${{ steps.dest.outputs.dest }}" \
            -resultBundlePath "$PWD/LegadoBridgeHooks.xcresult" \
            -derivedDataPath "$PWD/.build-test-full" \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            2>&1 | tee ../LegadoBridgeHooks-full.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SPM-full-test-logs
          path: |
            LegadoBridge/LegadoRuleCore.xcresult
            LegadoBridge/LegadoBridge.xcresult
            LegadoBridge/LegadoBridgeHooks.xcresult
            LegadoRuleCore-full.log
            LegadoBridge-full.log
            LegadoBridgeHooks-full.log
            spm-schemes.log
          if-no-files-found: warn

  # TC-11 stage 7：Release 隐私扫描（须在全量单测之后、出包之前）
  privacy-scan:
    needs: [spm-full-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Release log / privacy scan
        run: python3 tools/ci/validate_release_privacy.py

  build-bridge:
    # 单测 / 隐私扫描不过不出 IPA
    needs: [privacy-scan]
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: 同步 legado-ios 引擎（本地已 vendor 则跳过）
        run: |
          if [[ ! -d LegadoBridge/Sources/LegadoBridge/Vendor/Core/RuleEngine ]]; then
            if [[ -n "${{ secrets.LEGADO_IOS_PAT }}" ]]; then
              git clone --depth 1 "https://x-access-token:${{ secrets.LEGADO_IOS_PAT }}@github.com/chrn11/legado-ios.git" /tmp/legado-ios
              chmod +x tools/sync_legado_vendor.sh
              LEGADO_IOS_ROOT=/tmp/legado-ios bash tools/sync_legado_vendor.sh
            else
              echo "Vendor 未提交且无 LEGADO_IOS_PAT，尝试直接编译"
            fi
          else
            echo "已存在 LegadoBridge/Sources/LegadoBridge/Vendor，跳过同步"
          fi

      - name: 编译 LegadoBridge（iOS arm64）
        working-directory: LegadoBridge
        run: |
          set -euo pipefail
          swift package resolve
          echo "==> xcodebuild -list:"
          xcodebuild -list 2>&1 | tee -a spm-build.log
          xcodebuild \
            -scheme LegadoBridge \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            -skipPackagePluginValidation \
            2>&1 | tee -a spm-build.log
          echo "==> 产物:"
          find .build -name 'LegadoBridge' -type f -path '*Release-iphoneos*' | head -5

      - name: 准备 insert_dylib
        run: |
          if ! command -v insert_dylib; then
            git clone --depth 1 https://github.com/tyilo/insert_dylib /tmp/insert_dylib
            cd /tmp/insert_dylib && xcodebuild -configuration Release
            sudo cp build/Release/insert_dylib /usr/local/bin/ || cp build/Release/insert_dylib "$HOME/bin/"
            mkdir -p "$HOME/bin"
            export PATH="$HOME/bin:$PATH"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi

      - name: 重打包 IPA 并校验注入
        run: |
          set -euo pipefail
          chmod +x tools/repack/repack.sh tools/repack/verify_ipa.sh
          DYLIB=$(find LegadoBridge/.build -type f -name 'LegadoBridge' \
            -path '*Release-iphoneos*' -not -path '*dSYM*' 2>/dev/null | head -1)
          if [[ -z "$DYLIB" ]]; then
            DYLIB=$(find LegadoBridge/.build -type f -name 'libLegadoBridge.dylib' \
              -path '*Release-iphoneos*' 2>/dev/null | head -1)
          fi
          if [[ -z "$DYLIB" ]]; then
            echo "未找到 Release-iphoneos LegadoBridge dylib" >&2
            exit 1
          fi
          echo "==> 选用 dylib: $DYLIB"
          mkdir -p dist
          bash tools/repack/repack.sh \
            "ipa/香色闺阁2.56.1_未加密.ipa" \
            "$DYLIB" \
            "dist/StandarReader-legado-bridge.ipa"
          # repack.sh 末尾已调用 verify_ipa.sh（LC_LOAD_DYLIB / arm64 / Scheme / SHA256）
          ls -la dist/
          test -f dist/StandarReader-legado-bridge.ipa.sha256

      - name: TC-11 clone packaging 结构门禁（夹具 selftest）
        run: |
          set -euo pipefail
          python3 tools/ci/test_clone_packaging.py --mode selftest

      # 仅 Artifact，不创建 GitHub Release
      - uses: actions/upload-artifact@v4
        with:
          name: LegadoBridge-IPA
          path: |
            dist/StandarReader-legado-bridge.ipa
            dist/StandarReader-legado-bridge.ipa.sha256
            LegadoBridge/spm-build.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: LegadoBridge-build-logs
          path: |
            LegadoBridge/.build/**/*
            LegadoBridge/spm-build.log
          if-no-files-found: warn
          retention-days: 7

  build-bridge-debug:
    needs: [privacy-scan]
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: 同步 legado-ios 引擎（本地已 vendor 则跳过）
        run: |
          if [[ ! -d LegadoBridge/Sources/LegadoBridge/Vendor/Core/RuleEngine ]]; then
            if [[ -n "${{ secrets.LEGADO_IOS_PAT }}" ]]; then
              git clone --depth 1 "https://x-access-token:${{ secrets.LEGADO_IOS_PAT }}@github.com/chrn11/legado-ios.git" /tmp/legado-ios
              chmod +x tools/sync_legado_vendor.sh
              LEGADO_IOS_ROOT=/tmp/legado-ios bash tools/sync_legado_vendor.sh
            else
              echo "Vendor 未提交且无 LEGADO_IOS_PAT，尝试直接编译"
            fi
          else
            echo "已存在 LegadoBridge/Sources/LegadoBridge/Vendor，跳过同步"
          fi

      - name: 编译 LegadoBridge + LegadoBridgeDebug（iOS arm64）
        working-directory: LegadoBridge
        run: |
          set -euo pipefail
          swift package resolve
          echo "==> xcodebuild LegadoBridge:"
          xcodebuild \
            -scheme LegadoBridge \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            -skipPackagePluginValidation \
            2>&1 | tee -a spm-build-debug.log
          echo "==> xcodebuild LegadoBridgeDebug:"
          xcodebuild \
            -scheme LegadoBridgeDebug \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            -skipPackagePluginValidation \
            2>&1 | tee -a spm-build-debug.log
          echo "==> 产物:"
          find .build -name 'LegadoBridge' -type f -path '*Release-iphoneos*' | head -5
          find .build -name 'LegadoBridgeDebug' -type f -path '*Release-iphoneos*' | head -5

      - name: 准备 insert_dylib
        run: |
          if ! command -v insert_dylib; then
            git clone --depth 1 https://github.com/tyilo/insert_dylib /tmp/insert_dylib
            cd /tmp/insert_dylib && xcodebuild -configuration Release
            sudo cp build/Release/insert_dylib /usr/local/bin/ || cp build/Release/insert_dylib "$HOME/bin/"
            mkdir -p "$HOME/bin"
            export PATH="$HOME/bin:$PATH"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi

      - name: 重打包 debug IPA（双 dylib + manifest）
        run: |
          set -euo pipefail
          chmod +x tools/repack/repack_forensics.sh tools/repack/verify_forensics_ipa.sh
          DYLIB=$(find LegadoBridge/.build -type f -name 'LegadoBridge' \
            -path '*Release-iphoneos*' -not -path '*dSYM*' 2>/dev/null | head -1)
          if [[ -z "$DYLIB" ]]; then
            DYLIB=$(find LegadoBridge/.build -type f -name 'libLegadoBridge.dylib' \
              -path '*Release-iphoneos*' 2>/dev/null | head -1)
          fi
          DEBUG_DYLIB=$(find LegadoBridge/.build -type f -name 'LegadoBridgeDebug' \
            -path '*Release-iphoneos*' -not -path '*dSYM*' 2>/dev/null | head -1)
          if [[ -z "$DEBUG_DYLIB" ]]; then
            DEBUG_DYLIB=$(find LegadoBridge/.build -type f -name 'libLegadoBridgeDebug.dylib' \
              -path '*Release-iphoneos*' 2>/dev/null | head -1)
          fi
          if [[ -z "$DYLIB" ]]; then
            echo "未找到主 dylib" >&2
            exit 1
          fi
          echo "==> 主 dylib: $DYLIB"
          echo "==> 调试 dylib: ${DEBUG_DYLIB:-（无）}"
          mkdir -p dist
          bash tools/repack/repack_forensics.sh \
            legado-debug \
            "ipa/香色闺阁2.56.1_未加密.ipa" \
            "$DYLIB" \
            "${DEBUG_DYLIB:-}" \
            "dist/StandarReader-legado-bridge-debug.ipa"
          ls -la dist/
          test -f dist/StandarReader-legado-bridge-debug.ipa.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: LegadoBridge-IPA-Debug
          path: |
            dist/StandarReader-legado-bridge-debug.ipa
            dist/StandarReader-legado-bridge-debug.ipa.sha256
            LegadoBridge/spm-build-debug.log
          if-no-files-found: warn
